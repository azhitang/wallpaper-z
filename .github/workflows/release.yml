name: Build and publish Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      WALLPAPERZ_SIGNING_DIR: /tmp/wallpaperz-signing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CONFIG_BASE64: ${{ secrets.ANDROID_SIGNING_CONFIG_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          folder = Path(os.environ['WALLPAPERZ_SIGNING_DIR'])
          folder.mkdir(mode=0o700)
          for filename, variable in [('wallpaperz-release.jks', 'KEYSTORE_BASE64'), ('signing-config.json', 'CONFIG_BASE64')]:
              path = folder / filename
              path.write_bytes(base64.b64decode(os.environ[variable], validate=True))
              path.chmod(0o600)
          PY
      - name: Build, test, lint and sign
        run: python3 scripts/build_release.py testReleaseUnitTest lintRelease
      - name: Generate update manifest
        id: release
        run: python3 scripts/prepare_release.py
      - name: Publish APK and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_APK: ${{ steps.release.outputs.apk }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_APK.sha256" deliverables/update.json \
            --title "壁纸z $RELEASE_TAG" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA" --latest
      - name: Remove signing files
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          shutil.rmtree(os.environ['WALLPAPERZ_SIGNING_DIR'], ignore_errors=True)
          PY
